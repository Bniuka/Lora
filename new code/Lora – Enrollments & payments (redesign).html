<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lora – Enrollments &amp; payments</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--surface:#fff;--ink:#0e1733;--muted:#68728d;--line:#e3e7f1;--brand:#2f5bff;--brand2:#1d3fd1;--brand-soft:#e9eeff;--ok:#0b7f55;--ok-soft:#e3f7ee;--warn:#a35d00;--warn-soft:#fff2da;--bad:#c0283f;--bad-soft:#fde8ec;--gray:#5d6783;--gray-soft:#eef0f6;--shadow:0 1px 2px rgba(14,23,51,.05),0 10px 28px -16px rgba(14,23,51,.16);box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3,.amt{font-family:'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em;margin:0}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font:800 22px 'Bricolage Grotesque';padding:0 10px 22px}
.logo i{width:34px;height:34px;border-radius:11px;background:var(--brand);display:grid;place-items:center}.logo svg{width:16px;fill:#fff}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:500;margin-bottom:2px}
nav a:hover{background:var(--bg);color:var(--ink)}nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.tip{margin-top:auto;border-radius:16px;padding:16px;background:var(--brand-soft);font-size:13px;color:var(--muted)}
.tip b{display:block;color:var(--ink);font:700 15px 'Bricolage Grotesque';margin-bottom:4px}
.tip button{margin-top:10px;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;width:100%}
main{min-width:0}
.top{display:flex;align-items:center;gap:16px;padding:14px 32px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.gsearch{flex:1;max-width:460px;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.gsearch input{flex:1;border:0;background:none;padding:10px 0;outline:0;min-width:0;font:inherit}
.gsearch kbd{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}
.bell{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#8a5cff);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.who small{display:block;color:var(--muted);font-size:12px;line-height:1.1}
.page{max-width:1120px;padding:30px 32px 56px}
.hd h1{font-size:clamp(30px,4vw,40px)}.hd p{margin:4px 0 22px;color:var(--muted)}
.tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.q{flex:1;min-width:240px;max-width:380px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 14px;transition:.15s}
.q:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.q input{flex:1;border:0;background:none;padding:12px 0;outline:0;font:inherit;min-width:0}.q .ic{color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:14px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;border-radius:10px;padding:8px 14px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap}
.tabs button.on{background:var(--brand);color:#fff}
.tabs i{font-style:normal;font-size:12px;background:var(--gray-soft);color:var(--gray);border-radius:99px;padding:0 7px}
.tabs .on i{background:rgba(255,255,255,.24);color:#fff}
.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.en{display:grid;grid-template-columns:minmax(210px,1.2fr) 2fr auto;gap:22px;align-items:center;padding:18px 20px;transition:box-shadow .2s}
.en:hover{box-shadow:0 18px 38px -22px rgba(14,23,51,.35)}
.l{display:flex;gap:12px;align-items:center;min-width:0}
.l .av{width:46px;height:46px}
.l b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.l small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.d small{display:block;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.d b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.amt{font-size:18px;font-weight:800}
.r{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 12px;font-weight:700;font-size:12.5px}
.st:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.pending{background:var(--warn-soft);color:var(--warn)}.st.confirmed{background:var(--ok-soft);color:var(--ok)}.st.rejected{background:var(--bad-soft);color:var(--bad)}.st.expired{background:var(--gray-soft);color:var(--gray)}
.proof{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg) center/cover;display:grid;place-items:center;color:var(--muted);cursor:pointer;transition:.15s;padding:0}
.proof:hover{border-color:var(--brand);color:var(--brand)}
.b{border:0;border-radius:11px;padding:9px 16px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;gap:6px;align-items:center}
.b.ok{background:var(--ok);color:#fff}.b.ok:hover{filter:brightness(1.1)}
.b.no{background:var(--bad-soft);color:var(--bad)}.b.no:hover{background:var(--bad);color:#fff}
.empty{display:grid;justify-items:center;text-align:center;padding:56px 20px;background:radial-gradient(460px 200px at 50% 0,#e4ebff,transparent 70%),var(--surface)}
.empty .ring{width:84px;height:84px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;box-shadow:0 0 0 12px rgba(47,91,255,.06);margin-bottom:20px}
.empty .ring .ic{width:36px;height:36px}.empty h3{font-size:22px}.empty p{margin:4px 0 0;color:var(--muted)}
.lb{position:fixed;inset:0;background:rgba(14,23,51,.7);backdrop-filter:blur(6px);display:none;place-items:center;z-index:50;padding:20px}
.lb.show{display:grid}
.lb div{background:var(--surface);border-radius:22px;max-width:460px;width:100%;overflow:hidden}
.lb header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.lb header button{border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px}
.lb .img{aspect-ratio:3/4;max-height:60vh;width:100%;background:var(--bg) center/contain no-repeat;display:grid;place-items:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){.en{grid-template-columns:1fr auto}.d{grid-column:1/-1;order:3;padding-top:14px;border-top:1px dashed var(--line)}}
@media(max-width:900px){.app{grid-template-columns:1fr}
 aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;z-index:20;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
 .logo,.tip{display:none}nav{display:flex;width:100%;justify-content:space-around}nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;margin:0}
 .page{padding:20px 16px 96px}.top{padding:12px 16px}.who div{display:none}}
@media(max-width:560px){.en{grid-template-columns:1fr}.r{justify-content:flex-start}.d{grid-template-columns:1fr 1fr}.gsearch kbd{display:none}.q{max-width:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo"><i><svg viewBox="0 0 24 24"><path d="M12 3 22 21H2z"/></svg></i>Lora</div>
  <nav>
    <a href="/creator/dashboard"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
    <a href="/creator/packs"><svg class="ic" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>My Packs</a>
    <a href="/creator/create"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Create Pack</a>
    <a href="/creator/enrollments" class="on"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>Enrollments</a>
    <a href="/creator/settings"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Settings</a>
  </nav>
  <div class="tip"><b>Grow your audience</b>Share your courses with the world and make a bigger impact.<button>View tips</button></div>
</aside>
<main>
  <div class="top">
    <label class="gsearch"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Search courses, packs, students…" aria-label="Search"><kbd>Ctrl K</kbd></label>
    <div class="who"><button class="bell" aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21h4"/></svg></button><div class="av">BD</div><div><b>Binuka Dinsara</b><small>Creator</small></div></div>
  </div>
  <div class="page">
    <div class="hd"><h1>Enrollments &amp; payments</h1><p>Review payment proofs and approve or reject learner enrollments.</p></div>
    <div class="tools">
      <label class="q"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search by learner name…" aria-label="Search by learner name"></label>
      <div class="tabs" id="tabs" role="tablist"></div>
    </div>
    <div class="list" id="list"></div>
  </div>
</main>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true"><div><header><b id="lbT">Payment proof</b><button id="lbX" aria-label="Close">×</button></header><div class="img" id="lbI"></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
// SAMPLE DATA: replace with your real enrollments (same fields you use today)
let D=[
 {id:1,n:'Nimal Perera',e:'nimal@mail.com',p:'frcymrfy',a:'LKR 3000',m:'Bank transfer',t:'Oct 20, 2026 · 6:42 PM',s:'pending',img:''},
 {id:2,n:'Kavindi Silva',e:'kavindi@mail.com',p:'frcymrfy',a:'LKR 3000',m:'Payment link',t:'Oct 19, 2026 · 9:10 AM',s:'pending',img:''},
 {id:3,n:'Ruwan Fernando',e:'ruwan@mail.com',p:'frcymrfy',a:'LKR 3000',m:'Bank transfer',t:'Oct 17, 2026 · 2:25 PM',s:'confirmed',img:''},
 {id:4,n:'Sithara Jay',e:'sithara@mail.com',p:'frcymrfy',a:'LKR 3000',m:'Bank transfer',t:'Oct 15, 2026 · 8:03 PM',s:'rejected',img:''},
 {id:5,n:'Dilan Weerasinghe',e:'dilan@mail.com',p:'frcymrfy',a:'LKR 3000',m:'Payment link',t:'Oct 02, 2026 · 11:30 AM',s:'expired',img:''}];
const T=['all','pending','confirmed','rejected','expired'],L={all:'All',pending:'Pending',confirmed:'Confirmed',rejected:'Rejected',expired:'Expired'};
let f='all';const $=s=>document.querySelector(s);
const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),2200)};
function render(){
 $('#tabs').innerHTML=T.map(k=>`<button role="tab" class="${k===f?'on':''}" data-k="${k}">${L[k]}<i>${k==='all'?D.length:D.filter(x=>x.s===k).length}</i></button>`).join('');
 const q=$('#q').value.trim().toLowerCase(),rows=D.filter(x=>(f==='all'||x.s===f)&&x.n.toLowerCase().includes(q));
 $('#list').innerHTML=rows.length?rows.map(x=>`<article class="card en"><div class="l"><div class="av">${ini(x.n)}</div><div style="min-width:0"><b>${x.n}</b><small>${x.e}</small></div></div>
 <div class="d"><div><small>Pack</small><b>${x.p}</b></div><div><small>Amount</small><b class="amt">${x.a}</b></div><div><small>Method</small><b>${x.m}</b></div><div><small>Submitted</small><b>${x.t}</b></div></div>
 <div class="r"><span class="st ${x.s}">${L[x.s]}</span><button class="proof" data-i="${x.id}" aria-label="View payment proof"${x.img?` style="background-image:url(${x.img})"`:''}>${x.img?'':'<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>'}</button>
 ${x.s==='pending'?`<button class="b no" data-a="rejected" data-i="${x.id}">Reject</button><button class="b ok" data-a="confirmed" data-i="${x.id}"><svg class="ic" viewBox="0 0 24 24" style="width:16px"><path d="m5 12 5 5 9-10"/></svg>Approve</button>`:''}</div></article>`).join('')
 :`<div class="card empty"><div class="ring"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><h3>No enrollments found</h3><p>No enrollment records match your current filters.</p></div>`}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){f=b.dataset.k;render()}};
$('#q').oninput=render;
$('#list').onclick=e=>{
 const a=e.target.closest('[data-a]'),p=e.target.closest('.proof');
 if(a){const x=D.find(r=>r.id==a.dataset.i);x.s=a.dataset.a;/* call your existing approve/reject handler here */toast(x.s==='confirmed'?'Enrollment approved':'Enrollment rejected');render()}
 if(p){const x=D.find(r=>r.id==p.dataset.i);$('#lbT').textContent='Payment proof · '+x.n;$('#lbI').style.backgroundImage=x.img?`url(${x.img})`:'';$('#lbI').innerHTML=x.img?'':'Screenshot preview';$('#lb').classList.add('show')}};
$('#lbX').onclick=()=>$('#lb').classList.remove('show');$('#lb').onclick=e=>{if(e.target.id==='lb')e.currentTarget.classList.remove('show')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('show')});
render();
</script>
</body>
</html>
